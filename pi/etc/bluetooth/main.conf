# Managed by bt-pi-protocol (original saved as main.conf.orig)
[General]
# Major class: Networking / LAN access point
Class = 0x020300
DiscoverableTimeout = 0
PairableTimeout = 0
AlwaysPairable = true
FastConnectable = true
# Re-pairing from the host (after "Remove device") goes through the agent,
# which only accepts HOST_MAC.
JustWorksRepairing = confirm

[Policy]
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
